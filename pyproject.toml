[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pm-scheduler"
version = "0.1.0"
description = "Generate a preventive maintenance calendar from a task list, with iCalendar export"
requires-python = ">=3.10"
dependencies = ["icalendar>=5.0"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
